<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For you</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4e9d3;--ink:#4a2f35;--rose:#c9566b;--sage:#8a9a7b;--note:#fbe9b7}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;line-height:1.6;min-height:100vh}
.hand{font-family:Caveat,"Segoe Script",cursive}
section{max-width:560px;margin:0 auto;padding:48px 22px}

/* ENVELOPE */
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper);z-index:10;cursor:pointer;transition:opacity 1s .2s}
#intro.gone{opacity:0;pointer-events:none}
.env{position:relative;width:240px;height:160px;background:#ead9b8;border-radius:4px;box-shadow:0 14px 30px rgba(74,47,53,.2);transition:transform .8s}
.env:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 50%,#e0cba3 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 50%,#e0cba3 50%) right/50% 100% no-repeat}
.flap{position:absolute;left:0;top:0;width:100%;height:0;border-left:120px solid transparent;border-right:120px solid transparent;border-top:92px solid #d9c196;transform-origin:top;transition:transform .7s}
.seal{position:absolute;left:50%;top:70px;width:38px;height:38px;margin:0 0 0 -19px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c47a99,#8c4565);box-shadow:0 2px 5px rgba(0,0,0,.3);transition:opacity .4s}
#intro.open .flap{transform:rotateX(180deg)}
#intro.open .seal{opacity:0}
#intro.open .env{transform:translateY(30px) scale(1.1)}
.tap{margin-top:46px;color:#8c4565;font-size:22px}

/* BLOOM */
#bloom{position:fixed;inset:0;z-index:9;pointer-events:none}
#bloom svg{width:100%;height:100%}
.petal{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);animation:open 1.6s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes open{to{transform:scale(1)}}
.stem{stroke-dasharray:400;stroke-dashoffset:400;animation:grow 1.4s ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
#bloom.fade{opacity:0;transition:opacity 1.4s}

/* PAGE */
#page{opacity:0;transition:opacity 1.4s}
#page.show{opacity:1}
h1{font-weight:600;font-size:44px;line-height:1.1;margin:.2em 0 .1em}
.from{color:var(--rose);font-size:26px}
.letter{background:var(--note);padding:28px 26px;border-radius:3px;box-shadow:0 8px 22px rgba(74,47,53,.15);transform:rotate(-.6deg);font-style:italic;font-size:21px}
.letter p{margin:.6em 0}

/* CASSETTE */
.tape{position:relative;background:#c9d4b8;border:4px solid #a9b896;border-radius:14px;padding:16px;margin:10px 0 18px;box-shadow:0 10px 24px rgba(74,47,53,.18)}
.tape .label{background:#f3efdf;border-radius:8px;text-align:center;padding:4px;font-family:Caveat,cursive;font-size:22px}
.reels{display:flex;justify-content:space-around;align-items:center;background:#6a5a4c;border-radius:30px;margin:12px 20px 4px;padding:10px 0}
.reel{width:44px;height:44px;border-radius:50%;background:#f3efdf;border:7px solid #3b2d28}
.playing .reel{animation:spin 2.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.song{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #d8c7a4}
.song b{display:block;font-weight:600}
.song small{opacity:.7}
.play{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:#2f4a3a;color:#fff;font-size:14px;cursor:pointer}
.play:focus-visible,#intro:focus-visible{outline:3px solid var(--rose);outline-offset:3px}

/* PHOTOS */
.photos{display:grid;gap:30px;margin-top:10px}
figure{margin:0;background:#fff;padding:12px 12px 16px;box-shadow:0 8px 22px rgba(74,47,53,.18)}
figure:nth-child(odd){transform:rotate(-1.6deg)}
figure:nth-child(even){transform:rotate(1.4deg)}
.ph{aspect-ratio:4/5;background:linear-gradient(160deg,#f2d3da,#e6dcc0);display:flex;align-items:center;justify-content:center;color:#a47b84;text-align:center;padding:12px;overflow:hidden}
.ph img,.ph video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
figcaption{text-align:center;font-size:24px;margin-top:10px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s,transform .9s}
.reveal.in{opacity:1;transform:none}

/* COUNTER */
.count{text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.cell{background:#fff;border-radius:10px;padding:12px 4px;box-shadow:0 5px 14px rgba(74,47,53,.12)}
.cell b{display:block;font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.cell span{font-size:16px;opacity:.75}
.total{font-size:22px;color:var(--rose)}

@media (prefers-reduced-motion:reduce){.petal,.stem,.playing .reel{animation-duration:.01s}.reveal{transition:none}}
</style>
</head>
<body>

<div id="intro" role="button" tabindex="0" aria-label="Tap to open">
  <div class="env"><div class="flap"></div><div class="seal"></div></div>
  <div class="tap hand">Tap to open</div>
</div>
<div id="bloom" aria-hidden="true"></div>

<main id="page">
  <section>
    <p class="from hand" id="forfrom"></p>
    <h1 id="title"></h1>
    <div class="letter" id="letter"></div>
  </section>

  <section>
    <h2 class="hand" style="font-size:34px;margin:0">Songs for you</h2>
    <div class="tape" id="tape">
      <div class="label">Songs for you</div>
      <div class="reels"><div class="reel"></div><div class="reel"></div></div>
    </div>
    <div id="songs"></div>
  </section>

  <section>
    <h2 class="hand" style="font-size:34px;margin:0 0 6px">Us</h2>
    <div class="photos" id="photos"></div>
  </section>

  <section class="count">
    <h2 class="hand" style="font-size:34px;margin:0">Together for</h2>
    <div class="grid" id="grid"></div>
    <p class="total" id="total"></p>
    <p class="hand" style="font-size:26px">and still counting</p>
  </section>
</main>

<script>
/* ====== EDIT THIS PART ====== */
const CONFIG = {
  to: "Lyka maasim",
  from: "Prince Mabango",
  title: "I made you something",
  // Date you started dating: year, month (1-12), day, hour, minute (24h, your local time)
  since: [2024, 2, 14, 18, 30],
  letter: [
    "Hi Baby,",
    "Play mo to dalian mo.",
  ],
  songs: [
    { title: "Isip", artist: "Ako si kaito", file: "music.mp3" },
    { title: "eto wala pa to wag muna", artist: "Wala pa syempre", file: "" }
  ],
  // Put your videos (.mp4) in the same folder and write their file names here
  // Photos (.jpg/.png) work in this list too
  photos: [
    { src: "video3.jpg", caption: "Our first date" },
    { src: "video2.mp4", caption: "My favorite day" },
    { src: "video1.mp4", caption: "Uss Now" }
  ]
};
/* ============================ */

const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";

/* Fill text */
$("#forfrom").textContent = "For " + CONFIG.to + " · From " + CONFIG.from;
$("#title").textContent = CONFIG.title;
$("#letter").innerHTML = CONFIG.letter.map(t => "<p></p>").join("");
[...$("#letter").children].forEach((p, i) => p.textContent = CONFIG.letter[i]);

/* Songs */
let current = null;
CONFIG.songs.forEach(s => {
  const row = document.createElement("div");
  row.className = "song";
  row.innerHTML = '<div><b></b><small></small></div><button class="play" aria-label="Play">▶</button>';
  row.querySelector("b").textContent = s.title;
  row.querySelector("small").textContent = s.artist;
  const btn = row.querySelector("button");
  const audio = s.file ? new Audio(s.file) : null;
  btn.onclick = () => {
    const on = btn.textContent === "▶";
    if (current && current !== btn) current.click();
    btn.textContent = on ? "❚❚" : "▶";
    current = on ? btn : null;
    $("#tape").classList.toggle("playing", on);
    if (audio) on ? audio.play() : audio.pause();
  };
  $("#songs").appendChild(row);
});

/* Photos */
CONFIG.photos.forEach(p => {
  const f = document.createElement("figure");
  f.className = "reveal";
  f.innerHTML = '<div class="ph"></div><figcaption class="hand"></figcaption>';
  const box = f.querySelector(".ph");
  const isVideo = /\.(mp4|webm|mov)$/i.test(p.src);
  const el = document.createElement(isVideo ? "video" : "img");
  if (isVideo) { el.controls = true; el.playsInline = true; el.preload = "metadata"; }
  else { el.alt = p.caption; }
  el.src = p.src;
  el.onerror = () => { el.remove(); box.textContent = "Add " + p.src; };
  box.appendChild(el);
  f.querySelector("figcaption").textContent = p.caption;
  $("#photos").appendChild(f);
});
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); }), { threshold: .2 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

/* Counter */
const start = new Date(...[CONFIG.since[0], CONFIG.since[1] - 1, ...CONFIG.since.slice(2)]);
const labels = ["years", "months", "days", "hours", "minutes", "seconds"];
$("#grid").innerHTML = labels.map(l => '<div class="cell"><b>0</b><span>' + l + '</span></div>').join("");
function tick() {
  const now = new Date();
  let y = now.getFullYear() - start.getFullYear();
  let m = now.getMonth() - start.getMonth();
  let d = now.getDate() - start.getDate();
  let h = now.getHours() - start.getHours();
  let mi = now.getMinutes() - start.getMinutes();
  let s = now.getSeconds() - start.getSeconds();
  if (s < 0) { s += 60; mi--; }
  if (mi < 0) { mi += 60; h--; }
  if (h < 0) { h += 24; d--; }
  if (d < 0) { d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); m--; }
  if (m < 0) { m += 12; y--; }
  [y, m, d, h, mi, s].forEach((v, i) => $("#grid").children[i].firstChild.textContent = v);
  const hrs = Math.floor((now - start) / 36e5);
  $("#total").textContent = hrs.toLocaleString() + " hours since " +
    start.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }) +
    " at " + start.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
tick(); setInterval(tick, 1000);

/* Bloom animation */
function flower(cx, cy, size, hue, delay) {
  const g = document.createElementNS(NS, "g");
  const stem = document.createElementNS(NS, "path");
  stem.setAttribute("d", `M${cx} 1000 C${cx - 30} ${(1000 + cy) / 2} ${cx + 30} ${(1000 + cy) / 2 + 60} ${cx} ${cy}`);
  stem.setAttribute("class", "stem"); stem.setAttribute("fill", "none");
  stem.setAttribute("stroke", "#7f9570"); stem.setAttribute("stroke-width", 4);
  stem.style.animationDelay = delay + "s"; g.appendChild(stem);
  for (let i = 0; i < 9; i++) {
    const p = document.createElementNS(NS, "ellipse");
    p.setAttribute("cx", cx); p.setAttribute("cy", cy - size * .55);
    p.setAttribute("rx", size * .3); p.setAttribute("ry", size * .6);
    p.setAttribute("fill", `hsl(${hue + i * 3} 70% ${72 + (i % 3) * 5}%)`);
    p.setAttribute("opacity", .92);
    p.setAttribute("transform", `rotate(${i * 40} ${cx} ${cy})`);
    const w = document.createElementNS(NS, "g");
    w.setAttribute("class", "petal");
    w.style.animationDelay = (delay + 1 + i * .08) + "s";
    w.appendChild(p); g.appendChild(w);
  }
  const c = document.createElementNS(NS, "circle");
  c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", size * .17);
  c.setAttribute("fill", "#e9b44c"); g.appendChild(c);
  return g;
}
function bloom() {
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 600 1000");
  svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  [[300,420,150,340,0],[130,560,95,355,.4],[470,540,105,330,.6],[210,700,80,15,.9],[400,720,85,345,1.1],[70,780,60,350,1.3],[535,760,65,10,1.5]]
    .forEach(a => svg.appendChild(flower(...a)));
  $("#bloom").appendChild(svg);
}

/* Open sequence */
let opened = false;
function openIt() {
  if (opened) return; opened = true;
  $("#intro").classList.add("open");
  setTimeout(() => { $("#intro").classList.add("gone"); bloom(); }, 900);
  setTimeout(() => { $("#page").classList.add("show"); $("#bloom").classList.add("fade"); }, 5200);
  setTimeout(() => $("#bloom").remove(), 7000);
}
$("#intro").addEventListener("click", openIt);
$("#intro").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") openIt(); });
</script>
</body>
</html>
